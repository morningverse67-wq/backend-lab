<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
<title id="t">Stale reads right after a write</title>
<desc id="d">always replica 1,873 stale, 0.0% reads on primary; primary for 1 s 0 stale, 20.0% reads on primary; check applied position 0 stale, 3.7% reads on primary; always primary 0 stale, 100.0% reads on primary.</desc>
<rect width="900" height="380" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a">
<text x="28" y="40" font-size="22" font-weight="bold">Stale reads right after a write (10,000 writes)</text>
<line x1="90" y1="290" x2="850" y2="290" stroke="#94a3b8"/>
<rect x="135.0" y="70.0" width="100" height="220.0" fill="#ef4444"/>
<text x="185.0" y="64.0" font-size="13" text-anchor="middle">1,873</text>
<text x="185.0" y="312" font-size="12" text-anchor="middle">always replica</text>
<text x="185.0" y="330" font-size="12" text-anchor="middle">primary 0.0%</text>
<rect x="325.0" y="290.0" width="100" height="1.0" fill="#f59e0b"/>
<text x="375.0" y="284.0" font-size="13" text-anchor="middle">0</text>
<text x="375.0" y="312" font-size="12" text-anchor="middle">primary for 1 s</text>
<text x="375.0" y="330" font-size="12" text-anchor="middle">primary 20.0%</text>
<rect x="515.0" y="290.0" width="100" height="1.0" fill="#2563eb"/>
<text x="565.0" y="284.0" font-size="13" text-anchor="middle">0</text>
<text x="565.0" y="312" font-size="12" text-anchor="middle">check applied position</text>
<text x="565.0" y="330" font-size="12" text-anchor="middle">primary 3.7%</text>
<rect x="705.0" y="290.0" width="100" height="1.0" fill="#94a3b8"/>
<text x="755.0" y="284.0" font-size="13" text-anchor="middle">0</text>
<text x="755.0" y="312" font-size="12" text-anchor="middle">always primary</text>
<text x="755.0" y="330" font-size="12" text-anchor="middle">primary 100.0%</text>
<text x="28" y="340" font-size="13">Stale = read right after a write returned the old value. "primary %" = share of all reads served by the primary.</text>
<text x="28" y="366" font-size="13">Python 3.13.12, seeded simulation (seed 41).</text></g></svg>
