<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
<title id="t">Stale read ratio during delete delay</title>
<desc id="d">sync delete 0.00% stale reads; queue delete 5.18% stale reads; queue + tail 5.92% stale reads.</desc>
<rect width="900" height="380" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a">
<text x="28" y="40" font-size="22" font-weight="bold">Stale read ratio during delete delay</text>
<line x1="90" y1="290" x2="850" y2="290" stroke="#94a3b8"/>
<rect x="156.7" y="290.0" width="120" height="1.0" fill="#16a34a"/>
<text x="216.7" y="284.0" font-size="13" text-anchor="middle">0.00%</text>
<text x="216.7" y="312" font-size="12" text-anchor="middle">sync delete</text>
<text x="216.7" y="330" font-size="12" text-anchor="middle">0 of 1,000,589 reads</text>
<rect x="410.0" y="97.4" width="120" height="192.6" fill="#f59e0b"/>
<text x="470.0" y="91.4" font-size="13" text-anchor="middle">5.18%</text>
<text x="470.0" y="312" font-size="12" text-anchor="middle">queue delete</text>
<text x="470.0" y="330" font-size="12" text-anchor="middle">51,832 of 1,000,764 reads</text>
<rect x="663.3" y="70.0" width="120" height="220.0" fill="#ef4444"/>
<text x="723.3" y="64.0" font-size="13" text-anchor="middle">5.92%</text>
<text x="723.3" y="312" font-size="12" text-anchor="middle">queue + tail</text>
<text x="723.3" y="330" font-size="12" text-anchor="middle">59,210 of 1,000,681 reads</text>
<text x="28" y="340" font-size="13">1 s after each write, read rate 500/s, 2,000 writes (delay model is an assumption).</text>
<text x="28" y="366" font-size="13">Python 3.13.12, seeded simulation (seed 42).</text></g></svg>
