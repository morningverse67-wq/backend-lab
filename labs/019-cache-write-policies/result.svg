<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><rect width="960" height="460" fill="#fafafa"/><g font-family="Arial,sans-serif" fill="#222"><text x="40" y="45" font-size="26">Cache write policies: operation counts, not latency</text><text x="40" y="80" font-size="16">10 keys / 100 sequential writes + immediate reads</text><text x="255" y="125" font-size="17">DB updates (healthy)</text><text x="650" y="125" font-size="17">DB keys behind after crash*</text><text x="40" y="181" font-size="19">Cache-aside</text><rect x="255" y="155" width="300" height="36" fill="#287a74"/><text x="565" y="181" font-size="20">100</text><text x="720" y="181" font-size="24">0</text><text x="40" y="256" font-size="19">Write-through</text><rect x="255" y="230" width="300" height="36" fill="#287a74"/><text x="565" y="256" font-size="20">100</text><text x="720" y="256" font-size="24">0</text><text x="40" y="331" font-size="19">Write-behind</text><rect x="255" y="305" width="150" height="36" fill="#287a74"/><text x="415" y="331" font-size="20">50</text><text x="720" y="331" font-size="24">10</text><text x="40" y="400" font-size="16">*Separate run: cache + volatile queue lost after write 95; DB survives.</text><text x="40" y="430" font-size="16">Write-behind: flush every 20 writes, keep latest value per key. No network timing.</text></g></svg>