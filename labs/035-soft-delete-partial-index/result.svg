<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
<title id="t">Soft delete: full unique index vs partial unique index</title>
<desc id="d">100,000 users, 90,000 soft-deleted. Lookup time is the median of 5 runs.</desc>
<rect width="900" height="500" fill="#f8fafc"/><g font-family="sans-serif" fill="#0f172a">
<text x="28" y="40" font-size="24" font-weight="bold">Soft delete: 100,000 rows, 90,000 deleted</text>
<text x="28" y="80" font-size="16" font-weight="bold">Index size (4 KB pages)</text>
<text x="28" y="107" font-size="13">UNIQUE(email), all rows</text>
<rect x="330" y="92" width="420.0" height="20" fill="#dc2626"/>
<text x="756.0" y="107" font-size="14" fill="#dc2626">757</text>
<text x="28" y="137" font-size="13">UNIQUE(email) WHERE deleted_at IS NULL</text>
<rect x="330" y="122" width="41.1" height="20" fill="#2563eb"/>
<text x="377.1" y="137" font-size="14" fill="#2563eb">74</text>
<text x="28" y="180" font-size="16" font-weight="bold">Re-signup errors (1,000 deleted emails)</text>
<text x="28" y="207" font-size="13">UNIQUE(email), all rows</text>
<rect x="330" y="192" width="420.0" height="20" fill="#dc2626"/>
<text x="756.0" y="207" font-size="14" fill="#dc2626">1,000</text>
<text x="28" y="237" font-size="13">UNIQUE(email) WHERE deleted_at IS NULL</text>
<rect x="330" y="222" width="0.0" height="20" fill="#2563eb"/>
<text x="336.0" y="237" font-size="14" fill="#2563eb">0</text>
<text x="28" y="280" font-size="16" font-weight="bold">Duplicate active signups blocked (1,000)</text>
<text x="28" y="307" font-size="13">UNIQUE(email), all rows</text>
<rect x="330" y="292" width="420.0" height="20" fill="#dc2626"/>
<text x="756.0" y="307" font-size="14" fill="#dc2626">1,000</text>
<text x="28" y="337" font-size="13">UNIQUE(email) WHERE deleted_at IS NULL</text>
<rect x="330" y="322" width="420.0" height="20" fill="#2563eb"/>
<text x="756.0" y="337" font-size="14" fill="#2563eb">1,000</text>
<text x="28" y="380" font-size="16" font-weight="bold">ms for 10,000 active lookups</text>
<text x="28" y="407" font-size="13">UNIQUE(email), all rows</text>
<rect x="330" y="392" width="420.0" height="20" fill="#dc2626"/>
<text x="756.0" y="407" font-size="14" fill="#dc2626">8.1</text>
<text x="28" y="437" font-size="13">UNIQUE(email) WHERE deleted_at IS NULL</text>
<rect x="330" y="422" width="314.7" height="20" fill="#2563eb"/>
<text x="650.7" y="437" font-size="14" fill="#2563eb">6.0</text>
<text x="28" y="484" font-size="13">Python 3.13.12, SQLite 3.50.4; time varies by machine.</text></g></svg>
