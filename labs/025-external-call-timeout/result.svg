<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">An external call without a timeout blocks unrelated requests</title>
<desc id="desc">App with 8 worker threads. Slowest health check and median order latency, low median of 3 runs, log scale.</desc>
<rect width="1000" height="560" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#0f172a">
<text x="28" y="42" font-size="26" font-weight="bold">8 app workers, slow dependency: latency per request</text>
<text x="28" y="74" font-size="16">Real elapsed ms on one machine (log scale), low median of 3 runs. Timeout = 200 ms.</text>
<rect x="28" y="98" width="16" height="16" fill="#2563eb"/>
<text x="50" y="112" font-size="14">/health slowest (never calls the dependency)</text>
<rect x="448" y="98" width="16" height="16" fill="#dc2626"/>
<text x="470" y="112" font-size="14">/order median</text>
<line x1="280.0" y1="144" x2="280.0" y2="474" stroke="#cbd5e1"/>
<text x="280.0" y="496" font-size="14" text-anchor="middle">0.1 ms</text>
<line x1="397.0" y1="144" x2="397.0" y2="474" stroke="#cbd5e1"/>
<text x="397.0" y="496" font-size="14" text-anchor="middle">1 ms</text>
<line x1="513.9" y1="144" x2="513.9" y2="474" stroke="#cbd5e1"/>
<text x="513.9" y="496" font-size="14" text-anchor="middle">10 ms</text>
<line x1="630.9" y1="144" x2="630.9" y2="474" stroke="#cbd5e1"/>
<text x="630.9" y="496" font-size="14" text-anchor="middle">100 ms</text>
<line x1="747.8" y1="144" x2="747.8" y2="474" stroke="#cbd5e1"/>
<text x="747.8" y="496" font-size="14" text-anchor="middle">1,000 ms</text>
<line x1="864.8" y1="144" x2="864.8" y2="474" stroke="#cbd5e1"/>
<text x="864.8" y="496" font-size="14" text-anchor="middle">10,000 ms</text>
<text x="268" y="172" font-size="15" text-anchor="end">normal, no timeout</text>
<rect x="280" y="150" width="62.4" height="18" fill="#2563eb"/>
<text x="348.4" y="164" font-size="13" fill="#2563eb">0.3</text>
<rect x="280" y="170" width="275.5" height="18" fill="#dc2626"/>
<text x="561.5" y="184" font-size="13" fill="#dc2626">23</text>
<text x="268" y="226" font-size="15" text-anchor="end">stall, no timeout</text>
<rect x="280" y="204" width="562.4" height="18" fill="#2563eb"/>
<text x="848.4" y="218" font-size="13" fill="#2563eb">6,437</text>
<rect x="280" y="224" width="551.6" height="18" fill="#dc2626"/>
<text x="837.6" y="238" font-size="13" fill="#dc2626">5,206</text>
<text x="268" y="280" font-size="15" text-anchor="end">stall, connect timeout only</text>
<rect x="280" y="258" width="562.4" height="18" fill="#2563eb"/>
<text x="848.4" y="272" font-size="13" fill="#2563eb">6,439</text>
<rect x="280" y="278" width="551.6" height="18" fill="#dc2626"/>
<text x="837.6" y="292" font-size="13" fill="#dc2626">5,206</text>
<text x="268" y="334" font-size="15" text-anchor="end">stall, read timeout 200 ms</text>
<rect x="280" y="312" width="63.4" height="18" fill="#2563eb"/>
<text x="349.4" y="326" font-size="13" fill="#2563eb">0.3</text>
<rect x="280" y="332" width="386.6" height="18" fill="#dc2626"/>
<text x="672.6" y="346" font-size="13" fill="#dc2626">202</text>
<text x="268" y="388" font-size="15" text-anchor="end">drip, read timeout 200 ms</text>
<rect x="280" y="366" width="563.4" height="18" fill="#2563eb"/>
<text x="849.4" y="380" font-size="13" fill="#2563eb">6,565</text>
<rect x="280" y="386" width="552.5" height="18" fill="#dc2626"/>
<text x="838.5" y="400" font-size="13" fill="#dc2626">5,300</text>
<text x="268" y="442" font-size="15" text-anchor="end">drip, total deadline 200 ms</text>
<rect x="280" y="420" width="64.0" height="18" fill="#2563eb"/>
<text x="350.0" y="434" font-size="13" fill="#2563eb">0.4</text>
<rect x="280" y="440" width="386.5" height="18" fill="#dc2626"/>
<text x="672.5" y="454" font-size="13" fill="#dc2626">202</text>
<text x="28" y="538" font-size="14">The dependency runs in its own process. Python 3.13.12; numbers vary by machine.</text>
</g></svg>
